name: CI/CD Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  front-end-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Check frontend dependencies
        run: |
          ls -la frontend 
          ls -la frontend/node_modules/.bin/ng

      - name: Run tests (Jest)
        run: npm run test -- --coverage
        working-directory: ./frontend


      - name: Build app
        run: npm run build
        working-directory: ./frontend

  backend-unit-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mind_for_minds
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mind_for_minds_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev --deploy
        working-directory: ./backend

      - name: Write .env file
        run: |
          echo "DJANGO_SECRET_KEY=test-only-django-secret-key" > .env
          echo "DB_USER=mind_for_minds" >> .env
          echo "DB_PASSWORD=test_password" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "ENV=dev" >> .env
        working-directory: ./backend

      - name: Run tests
        run: pipenv run pytest
        working-directory: ./backend

        env:
          DJANGO_SETTINGS_MODULE: mind_for_minds.settings
          DEBUG: "1"


