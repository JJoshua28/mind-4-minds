@defer (when userAccount) {
  <main
    class="w-100 h-100 d-flex"
  >
    <div
      class="d-flex gap-5 content-container mt-4"
    >
      <div
        class="w-75"
      >
        <app-user-details
          (refreshData)="refreshDetails()"
          [$userAccount]="userAccount()"
        />
      </div>
      <app-sidebar-navigation
        (updateData)="refreshDetails()"
        [$user]="userAccount()"
      />
    </div>
  </main>

}
